<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees · Dayflow HRMS</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="df-shell">
  <main id="df-content">

    <div class="page-head">
      <div>
        <h1>Employee Management</h1>
        <p class="ph-sub">Search, filter, view, edit, add and deactivate employees.</p>
      </div>
      <button class="btn btn-dayflow" id="emp-add-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add employee
      </button>
    </div>

    <!-- filters -->
    <div class="filter-bar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" class="form-control" id="emp-search" placeholder="Search by name, ID, email or position…">
      </div>
      <select class="form-select" id="emp-dept-filter" style="width:auto;min-width:170px">
        <option value="all">All departments</option>
      </select>
      <span class="text-muted-2 small-2 ms-auto" id="emp-count">–</span>
    </div>

    <!-- employee list -->
    <div class="df-card">
      <div class="table-wrap" id="emp-table-wrap">
        <div class="p-3">
          <span class="skeleton sk-line w-80"></span><span class="skeleton sk-line w-60"></span><span class="skeleton sk-line w-80"></span>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/hr.js"></script>
</body>
</html>
